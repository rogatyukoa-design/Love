<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Для тебе ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050509;color:white;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle,#29101e,#050509 70%);transition:opacity .6s ease}
.heartButton{width:145px;height:145px;border-radius:50%;display:flex;align-items:center;justify-content:center;
background:linear-gradient(145deg,#ff4d78,#df174e);font-size:72px;cursor:pointer;
box-shadow:0 0 35px rgba(255,50,100,.55);animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.09)}}
.card{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease;transform:scale(.8)}
.card.show{opacity:1;pointer-events:auto;transform:scale(1)}
.card.hide{opacity:0;pointer-events:none;transform:scale(.8)}
.cardInside{width:min(330px,86vw);min-height:410px;border-radius:28px;padding:35px 25px;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
background:linear-gradient(145deg,#ff4c78,#b7134a);box-shadow:0 20px 80px rgba(255,30,90,.45)}
.bigHeart{font-size:82px;margin-bottom:10px}
.card h2{font-size:32px;margin:8px 0 15px}
.card p{font-size:18px;line-height:1.5;margin:0 0 30px}
#openPhoto{border:0;border-radius:999px;padding:15px 28px;background:white;color:#b7134a;
font-size:17px;font-weight:bold;cursor:pointer}
.message{position:fixed;left:10px;right:10px;top:20px;z-index:10;text-align:center;
font-size:19px;font-weight:bold;opacity:0;transition:opacity .5s;text-shadow:0 2px 12px #000}
.message.show{opacity:1}
.flyingHeart{position:fixed;z-index:40;pointer-events:none;animation:fly 1.5s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}
to{transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%)) scale(1.2);opacity:0}}
.effectHeart{
  position:fixed;z-index:15;pointer-events:none;
  font-size:var(--size);left:var(--left);top:105vh;
  opacity:0;filter:drop-shadow(0 0 8px rgba(255,80,140,.7));
  animation:heartRise var(--dur) ease-out forwards;
}
@keyframes heartRise{
  0%{transform:translateX(0) scale(.4) rotate(0deg);opacity:0}
  12%{opacity:1}
  70%{opacity:.9}
  100%{transform:translateX(var(--drift)) translateY(-125vh) scale(1.15) rotate(25deg);opacity:0}
}
.sparkle{
  position:fixed;z-index:16;pointer-events:none;color:white;
  font-size:var(--size);left:var(--left);top:var(--top);
  opacity:0;animation:sparkle .9s ease-out forwards;
  text-shadow:0 0 10px #fff,0 0 18px #ff4f88;
}
@keyframes sparkle{
  0%{opacity:0;transform:scale(.2) rotate(0)}
  35%{opacity:1;transform:scale(1.2) rotate(45deg)}
  100%{opacity:0;transform:scale(0) rotate(90deg)}
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="start" id="start">
  <div class="heartButton" id="heartButton">❤️</div>
</div>

<div class="card" id="card">
  <div class="cardInside">
    <div class="bigHeart">❤️</div>
    <h2>Для тебе</h2>
    <p>Я дуже радий, що ти є в моєму житті ❤️<br>Ти робиш мене щасливим.</p>
    <button id="openPhoto">Відкрити ❤️</button>
  </div>
</div>

<div class="message" id="message"></div>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const heartButton=document.getElementById("heartButton");
const card=document.getElementById("card");
const openPhoto=document.getElementById("openPhoto");
const message=document.getElementById("message");

let W=0,H=0,dpr=1;
let startImage=null,dotImage=null,started=false;

function resize(){
  W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener("resize",resize);

function load(src){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=src;
  });
}

Promise.all([load(START_PHOTO),load(DOT_PHOTO)]).then(a=>{
  startImage=a[0]; dotImage=a[1];
});

heartButton.onclick=()=>{
  if(started)return;
  started=true;
  createHearts();
  start.style.opacity="0";
  setTimeout(()=>{
    start.style.display="none";
    // Фонова перша фотка не закриває відкритку.
    drawFirstPhoto();
    card.classList.add("show");
  },600);
};

openPhoto.onclick=()=>{
  card.classList.remove("show");
  card.classList.add("hide");
  setTimeout(()=>{
    card.style.display="none";
    createPixelPhoto();
  },650);
};

function drawFirstPhoto(){
  if(!startImage)return;
  ctx.clearRect(0,0,W,H);
  const s=Math.max(W/startImage.width,H/startImage.height);
  const w=startImage.width*s,h=startImage.height*s;
  ctx.globalAlpha=.35;
  ctx.drawImage(startImage,(W-w)/2,(H-h)/2,w,h);
  ctx.globalAlpha=1;
  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0,0,W,H);
}

function createHearts(){
  for(let i=0;i<30;i++){
    const e=document.createElement("div");
    e.className="flyingHeart"; e.textContent=Math.random()>.5?"❤":"♥";
    e.style.left="50vw"; e.style.top="50vh";
    e.style.setProperty("--x",Math.random()*W+"px");
    e.style.setProperty("--y",Math.random()*H+"px");
    e.style.fontSize=12+Math.random()*25+"px";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1600);
  }
}


function startLoveEffects(duration){
  const end = Date.now() + duration;

  // Постійний потік маленьких сердечок знизу.
  const heartTimer = setInterval(()=>{
    if(Date.now() > end){
      clearInterval(heartTimer);
      return;
    }
    const e=document.createElement("div");
    e.className="effectHeart";
    e.textContent=["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];
    e.style.setProperty("--size",(14+Math.random()*24)+"px");
    e.style.setProperty("--left",(Math.random()*100)+"vw");
    e.style.setProperty("--drift",(-80+Math.random()*160)+"px");
    e.style.setProperty("--dur",(2.2+Math.random()*1.5)+"s");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),4200);
  },120);

  // Блискітки навколо майбутньої фотографії.
  const sparkleTimer = setInterval(()=>{
    if(Date.now() > end){
      clearInterval(sparkleTimer);
      return;
    }
    const e=document.createElement("div");
    e.className="sparkle";
    e.textContent=["✦","✧","✨"][Math.floor(Math.random()*3)];
    e.style.setProperty("--size",(12+Math.random()*18)+"px");
    e.style.setProperty("--left",(10+Math.random()*80)+"vw");
    e.style.setProperty("--top",(10+Math.random()*75)+"vh");
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),1000);
  },180);
}

function createPixelPhoto(){
  if(!dotImage)return;
  ctx.clearRect(0,0,W,H);

  const maxW=W*.9,maxH=H*.78;
  const s=Math.min(maxW/dotImage.width,maxH/dotImage.height);
  const w=Math.floor(dotImage.width*s),h=Math.floor(dotImage.height*s);
  const tmp=document.createElement("canvas");
  tmp.width=w;tmp.height=h;
  const t=tmp.getContext("2d");
  t.drawImage(dotImage,0,0,w,h);
  const d=t.getImageData(0,0,w,h).data;
  const ox=(W-w)/2,oy=(H-h)/2;

  // Менше крапочок = плавніше працює на телефоні.
  const step=Math.max(8,Math.floor(Math.min(w,h)/130));
  const pts=[];

  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      const i=(y*w+x)*4;
      if(d[i+3]<40)continue;
      pts.push({
        x0:Math.random()*W,y0:Math.random()*H,
        x1:ox+x,y1:oy+y,
        r:d[i],g:d[i+1],b:d[i+2]
      });
    }
  }

  const startTime=performance.now();
  const duration=2300;

  // Сердечка та блискітки літають, поки фотографія збирається.
  startLoveEffects(3200);

  function frame(now){
    const p=Math.min(1,(now-startTime)/duration);
    const ease=1-Math.pow(1-p,3);
    ctx.clearRect(0,0,W,H);

    for(const q of pts){
      const x=q.x0+(q.x1-q.x0)*ease;
      const y=q.y0+(q.y1-q.y0)*ease;
      ctx.fillStyle=`rgb(${q.r},${q.g},${q.b})`;
      ctx.fillRect(x,y,step,step);
    }

    if(p<1) requestAnimationFrame(frame);
    else{
      message.textContent="Ти — найкраще, що зі мною сталося ❤️";
      message.classList.add("show");
    }
  }
  requestAnimationFrame(frame);
}
</script>
